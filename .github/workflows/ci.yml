name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        # pytest-xdist workers for scripts/check, measured on these images. The
        # suite mostly waits on subprocesses: Linux (4 vCPU) gains up to about 6-8
        # workers; macOS (3 vCPU) plateaus at 4-6 and slows at 12.
        include:
          - os: ubuntu-24.04
            pytest-workers: "8"
          - os: macos-15
            pytest-workers: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.5"
          python-version: "3.12.15"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install UI development compiler
        run: npm ci --ignore-scripts
      - name: Run deterministic gate
        env:
          PYTEST_WORKERS: ${{ matrix.pytest-workers }}
        run: scripts/check
      - name: Build distribution
        run: uv build --out-dir dist
