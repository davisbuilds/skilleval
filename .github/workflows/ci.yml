name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        # pytest-xdist workers for scripts/check. The suite mostly waits on
        # subprocesses, so these exceed the hosted runners' vCPU counts.
        include:
          - os: ubuntu-24.04
            pytest-workers: "8"
          - os: macos-15
            pytest-workers: "6"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12.15"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run deterministic gate
        env:
          PYTEST_WORKERS: ${{ matrix.pytest-workers }}
        run: scripts/check
      - name: Benchmark pytest worker counts (temporary)
        shell: bash
        run: |
          nproc 2>/dev/null || sysctl -n hw.ncpu
          for workers in 3 4 6 8 12; do
            start=$(date +%s)
            uv run --locked pytest -q -p no:cacheprovider -n "$workers" | tail -1
            echo "workers=$workers wall=$(( $(date +%s) - start ))s"
          done
      - name: Build distribution
        run: uv build --out-dir dist
