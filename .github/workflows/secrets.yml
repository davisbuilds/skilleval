name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * 2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - name: Build pinned scanner and verify its dependency graph
        run: .github/ci-tools/build-gitleaks.sh "$RUNNER_TEMP/gitleaks"
      - name: Verify detection with a synthetic credential pattern
        shell: bash
        run: |
          control_dir=$(mktemp -d "$RUNNER_TEMP/gitleaks-control.XXXXXX")
          trap 'rm -rf -- "$control_dir"' EXIT
          printf 'github_token = %s_%s\n' ghp "$(openssl rand -hex 18)" > "$control_dir/control.txt"
          if "$RUNNER_TEMP/gitleaks" dir --redact --no-banner "$control_dir"; then
            echo 'Known-positive scanner control was missed' >&2
            exit 1
          else
            result=$?
            test "$result" -eq 1
          fi
      - name: Scan complete fetched history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts=--all .'
