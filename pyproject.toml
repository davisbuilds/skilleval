[project]
name = "skilleval"
version = "0.1.0"
description = "Controlled skill comparisons on real agent tasks"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3"]

[project.scripts]
skilleval = "skilleval.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.14", "mypy>=1.18"]

[tool.uv]
required-version = ">=0.9.17"
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "C4", "SIM", "ERA", "RUF", "PIE", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/skilleval"]
